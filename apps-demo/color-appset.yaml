apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: color
  namespace: argocd

spec:
  goTemplate: true
  generators:
    - list:
        elements:
          - cluster: demo-dev
            shortname: dev
            agent: agent-dev
          - cluster: demo-qa
            shortname: qa
            agent: agent-qa
          - cluster: demo-staging
            shortname: staging
            agent: agent-staging
          - cluster: demo-east
            shortname: east
            agent: agent-east
          - cluster: demo-west
            shortname: west
            agent: agent-west
  template:
    metadata:
      name: 'color-{{ .shortname }}'

      finalizers:
        - resources-finalizer.argocd.argoproj.io/foreground
      annotations:
        notifications.argoproj.io/subscribe.on-sync-succeeded.grafana: color
        argocd.argoproj.io/manifest-generate-paths: '.'
        # codefresh.io/product: color
        # codefresh.io/app-group: color
        argo.octopus.com/project: "color"
        argo.octopus.com/environment: "{{ .shortname }}"
        #argo.octopus.com/tenant: '{{ .metadata.labels.tenant }}'

    spec:
      project: default
      source:
        repoURL: https://github.com/aperture-sci/DevOps.git
        targetRevision: main
        path: 'manifests/color/{{ .shortname }}'
      destination:
        # use name of the agent
        # do not use the destination.server field
        name: '{{ .agent }}'
        namespace: '{{ .shortname }}'
      syncPolicy:
        automated:
          # enabled: false
          prune: true
          selfHeal: true
        syncOptions:
          - PrunePropagationPolicy=foreground
          - Replace=false
          - PruneLast=false
          - Validate=true
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=false
