apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: color

spec:
  goTemplate: true
  generators:
    - list:
        element:
          - cluster: dev-agent
            shortname: dev

  template:
    metadata:
      name: 'color-{{ .shortname }}'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io/foreground
      annotations:
        notifications.argoproj.io/subscribe.on-sync-succeeded.grafana: color
        argocd.argoproj.io/manifest-generate-paths: '.'
        # codefresh.io/product: color
        # codefresh.io/app-group: color
        argo.octopus.com/project: "color"
        argo.octopus.com/environment: "{{ .shortname }}"
        #argo.octopus.com/tenant: '{{ .metadata.labels.tenant }}'

    spec:
      project: default
      source:
        repoURL: https://github.com/aperture-sci/DevOps.git
        targetRevision: main
        path: 'manifests/color/{{ .shortname }}'
      destination:
        name: '{{ .cluster }}'
        namespace: '{{ .shortname }}'
      syncPolicy:
        automated:
          # enabled: false
          prune: true
          selfHeal: true
        syncOptions:
          - PrunePropagationPolicy=foreground
          - Replace=false
          - PruneLast=false
          - Validate=true
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=false
